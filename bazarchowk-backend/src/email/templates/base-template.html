<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BazarChowk Email</title>
</head>

<body
    style="margin:0;padding:0;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0" border="0"
                    style="max-width:600px;width:100%;padding:40px 24px;">

                    <tr>
                        <td style="height:4px;background:#FF8A00;border-radius:999px;"></td>
                    </tr>

                    <tr>
                        <td align="center" style="padding:36px 0;">
                            <img src="https://bazarchowk.com/logo.png" alt="BazarChowk" width="180"
                                style="display:block;border:0;">
                        </td>
                    </tr>

                    <tr>
                        <td>

                            <h1 style="
margin:0 0 20px;
font-size:30px;
font-weight:700;
color:#111111;">
                                {{TITLE}}
                            </h1>

                            <p style="
margin:0 0 20px;
font-size:16px;
line-height:28px;
color:#444444;">
                                Hello {{CUSTOMER_NAME}},
                            </p>

                            <p style="
margin:0;
font-size:16px;
line-height:30px;
color:#444444;">
                                {{MESSAGE}}
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td style="padding-top:40px;">

                            <a href="{{BUTTON_URL}}" style="
background:#FF8A00;
color:#ffffff;
text-decoration:none;
padding:14px 28px;
border-radius:8px;
display:inline-block;
font-size:15px;
font-weight:600;">
                                {{BUTTON_TEXT}}
                            </a>

                        </td>
                    </tr>

                    <tr>
                        <td style="padding-top:40px;">

                            <p style="
margin:0;
font-size:15px;
line-height:28px;
color:#444444;">
                                Regards,<br>
                                <strong>Team BazarChowk</strong>
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td style="padding-top:40px;">
                            <hr style="border:none;border-top:1px solid #eeeeee;">
                        </td>
                    </tr>

                    <tr>
                        <td align="center" style="padding-top:20px;">

                            <p style="
margin:0;
font-size:13px;
color:#888888;">
                                BazarChowk — Everything Your Local Market Offers
                            </p>

                            <p style="
margin:8px 0 0;
font-size:13px;
color:#888888;">
                                support@bazarchowk.in
                            </p>

                            <p style="
margin:8px 0 0;
font-size:12px;
color:#aaaaaa;">
                                © 2026 BazarChowk. All Rights Reserved.
                            </p>

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
