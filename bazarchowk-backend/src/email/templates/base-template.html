<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BazarChowk</title>
</head>
<body style="margin:0;padding:0;background-color:#F1F3F6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F1F3F6;padding:20px 0;">
        <tr>
            <td align="center">
                <!-- Main Container -->
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;background-color:#FFFFFF;border-radius:8px;border:1px solid #E0E0E0;box-shadow:0 1px 4px rgba(0,0,0,0.05);overflow:hidden;">
                    
                    <!-- Top Logo (Optional if they want it at bottom, but good for branding) -->
                    <tr>
                        <td align="left" style="padding:24px 32px 16px;">
                            <img src="https://bazarchowk.com/logo.png" alt="BazarChowk" height="32" style="display:block;border:0;">
                        </td>
                    </tr>

                    <!-- Header Content -->
                    <tr>
                        <td align="left" style="padding:0 32px 20px;">
                            <h2 style="margin:0 0 4px;font-size:16px;font-weight:600;color:#212121;">
                                Hi {{CUSTOMER_NAME}},
                            </h2>
                            <p style="margin:0;font-size:14px;color:#878787;">
                                {{TITLE}}
                            </p>
                        </td>
                    </tr>

                    <!-- Action Box -->
                    <tr>
                        <td align="center" style="padding:0 32px 24px;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F9FBFF;border:1px solid #D6E4F0;border-radius:4px;padding:20px;">
                                <tr>
                                    <td align="left">
                                        <p style="margin:0 0 12px;font-size:14px;color:#212121;line-height:1.5;">
                                            {{MESSAGE}}
                                        </p>
                                        <a href="{{BUTTON_URL}}" style="display:inline-block;background-color:#2874F0;color:#FFFFFF;text-decoration:none;font-size:14px;font-weight:600;padding:10px 24px;border-radius:2px;">
                                            {{BUTTON_TEXT}}
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer Message -->
                    <tr>
                        <td align="left" style="padding:0 32px 24px;">
                            <p style="margin:0 0 16px;font-size:14px;font-weight:600;color:#212121;">
                                Thank you for shopping with BazarChowk!
                            </p>
                            <p style="margin:0;font-size:12px;color:#878787;">
                                Got Questions? Please get in touch with our <a href="https://bazarchowk.com/support" style="color:#2874F0;text-decoration:none;">24x7 Customer Care</a>
                            </p>
                        </td>
                    </tr>

                    <!-- Bottom Divider -->
                    <tr>
                        <td style="padding:0 32px;">
                            <hr style="border:none;border-top:1px solid #F0F0F0;margin:0;">
                        </td>
                    </tr>

                    <!-- Bottom Footer -->
                    <tr>
                        <td align="left" style="padding:16px 32px 24px;">
                            <p style="margin:0;font-size:11px;color:#878787;line-height:1.5;">
                                This email was sent from a notification-only address that cannot accept incoming email. Please do not reply to this message.
                            </p>
                        </td>
                    </tr>
                </table>

            </td>
        </tr>
    </table>
</body>
</html>
